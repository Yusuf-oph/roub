# Déploie le contenu de app/ sur GitHub Pages à chaque push sur main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # le site pèse ~130 Mo (823 mp3 embarqués) : le délai par défaut de
          # 10 minutes ne suffit plus quand Pages est lent, l'action abandonne
          # sur « Timeout reached, aborting! » alors que rien n'est cassé
          timeout: 1800000
