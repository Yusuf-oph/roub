<!-- Le clair est devenu le défaut : la barre du navigateur suit --bg de Vélin
     dans chaque mode. Deux déclarations, celle qui porte media ne s'applique
     que si le système est en sombre. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f">
<link rel="stylesheet" href="roub-themes.css">
<link rel="stylesheet" href="styles.css">

<!-- ⚠ NOMS DE FICHIERS NEUFS : les navigateurs cachent les icônes de PWA par
     URL, écraser les anciennes en gardant leur nom laisserait les appareils
     déjà installés sur l'ancienne image, parfois très longtemps. -->
<link rel="apple-touch-icon" href="icons/roub-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="icons/roub-192.png">

<body>
<!-- L'ENTRELACS déclaré UNE fois, référencé partout : barre du haut (44 px) et
     en-tête de l'accueil (84 px). Copie conforme de tools/logo/roub-logo.svg.
     Écrit dans la page plutôt que chargé en <img> : currentColor n'agit que
     sur un SVG inline ou un masque CSS, et il ne peut pas manquer hors
     connexion. Les masques portent des identifiants préfixés, ils vivent dans
     le document entier où l'application injecte beaucoup de balisage.
     ⚠⚠ NE JAMAIS METTRE `display:none` SUR CE PORTEUR. Payé le 27/07 : dans cet
     état le navigateur N'APPLIQUE PAS les masques référencés, et ce sont eux qui
     découpent les rubans à chaque croisement. Le logo se dessine alors sans son
     entrelacement, les traits se traversant à plat : la géométrie est juste, le
     dessin est faux. D'où ce masquage par 0 × 0 hors flux, qui cache le porteur
     sans désactiver ses masques. Vérification : rendre tools/logo/roub-logo.svg
     seul et comparer les pixels, l'écart doit être NUL.
     ⚠ 44 px est un SEUIL MESURÉ, pas un goût : en dessous, le trait (1,35 unité
     sur une grille de 64) et l'écart entre les deux lignes du ruban passent
     sous le pixel, et l'anticrénelage écrase le double filet en un trait gris.
     C'est ce qui fixe --topbar-h à 64 px. Sous ce seuil, servir la réduction en
     filet simple, roub-logo-compact.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs><mask
    id="logo-carre" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect
    width="64" height="64" fill="#fff"/><polygon points="24.791,15.775 16.659,15.775 23.209,9.225 31.341,9.225" fill="#000"/><polygon
    points="54.775,31.341 54.775,23.209 48.225,16.659 48.225,24.791" fill="#000"/><polygon
    points="40.791,54.775 32.659,54.775 39.209,48.225 47.341,48.225" fill="#000"/><polygon
    points="15.775,47.341 15.775,39.209 9.225,32.659 9.225,40.791" fill="#000"/></mask><mask
    id="logo-losange" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect
    width="64" height="64" fill="#fff"/><polygon points="47.507,15.375 41.757,9.625 32.493,9.625 38.243,15.375" fill="#000"/><polygon
    points="48.625,47.507 54.375,41.757 54.375,32.493 48.625,38.243" fill="#000"/><polygon
    points="31.507,54.375 25.757,48.625 16.493,48.625 22.243,54.375" fill="#000"/><polygon
    points="9.625,31.507 15.375,25.757 15.375,16.493 9.625,22.243" fill="#000"/></mask></defs><symbol
    id="logo-roub" viewBox="0 0 64 64"><g fill="none" stroke="currentColor"
    stroke-width="1.35" stroke-linejoin="miter"><g mask="url(#logo-carre)"><path
    d="M11.1 11.1H52.9V52.9H11.1Z"/><path d="M13.9 13.9H50.1V50.1H13.9Z"/></g><g
    mask="url(#logo-losange)"><path d="M32 3.1L60.9 32L32 60.9L3.1 32Z"/><path
    d="M32 5.9L58.1 32L32 58.1L5.9 32Z"/></g><path
    d="M32 18.5L35.954 22.454L41.546 22.454L41.546 28.046L45.5 32L41.546 35.954L41.546 41.546L35.954 41.546L32 45.5L28.046 41.546L22.454 41.546L22.454 35.954L18.5 32L22.454 28.046L22.454 22.454L28.046 22.454Z"/></g></symbol></svg>
<div class="topbar">
  <!-- L'ENTRELACS à double filet, copie conforme de tools/logo/roub-logo.svg.
       Écrit dans la page et non chargé en <img> : il hérite ainsi de
       currentColor et ne peut pas manquer hors connexion. Décoratif, le nom
       étant juste à côté en toutes lettres.
       ⚠ 44 px est un SEUIL MESURÉ, pas un goût : en dessous, le trait (1,35
       unité sur une grille de 64) et l'écart entre les deux lignes du ruban
       passent sous le pixel, et l'anticrénelage écrase le double filet en un
       trait gris. C'est pourquoi --topbar-h vaut 64 px. Sous ce seuil, servir
       roub-logo-compact.svg, qui est la réduction en filet simple.
       Les identifiants des masques sont préfixés : ils vivent dans le document
       entier, où l'application injecte beaucoup de balisage. -->
  <!-- Le retour vit ICI et non dans l'en-tête du roub' (Yusuf, 28/07) : c'est là
       qu'on le cherche partout ailleurs, et l'en-tête y gagne une ligne entière.
       Masqué hors d'un roub', où il n'aurait nulle part où revenir. -->
  <button class="tb-back" id="tb-back" hidden
    title="revenir à tous les roub'" aria-label="revenir à tous les roub'">←</button>
  <div class="logo"><span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><use
      href="#logo-roub"/></svg></span><b>Roub'</b></div>
  <!-- Icônes dessinées ici plutôt que reprises d'un jeu tiers : elles suivent le
       trait des autres (24×24, currentColor, 1.8 de graisse, bouts ronds) et
       n'ajoutent aucune licence à porter. Le libellé RESTE : une icône seule se
       devine, elle ne se lit pas. -->
  <div class="nav">
    <button data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      ><path d="M3.5 11.4 12 4l8.5 7.4"/><path d="M5.9 10.2V20h12.2v-9.8"/><path
      d="M10 20v-4.6h4V20"/></svg><span>Accueil</span></button>
    <button data-page="revision"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      ><path d="M6.6 3.6h10.9a1.5 1.5 0 0 1 1.5 1.5v13.8a1.5 1.5 0 0 1-1.5 1.5H6.6A1.6 1.6 0 0 1 5 18.8V5.2a1.6 1.6 0 0 1 1.6-1.6Z"/><path
      d="M8.4 3.6v16.8"/><path d="M11.6 8h4.2"/></svg><span>Révision</span></button>
    <button data-page="tutoriels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      ><path d="M12 4.2 2.8 8.4 12 12.6l9.2-4.2L12 4.2Z"/><path
      d="M6.6 10.5v4.2c0 1.3 2.4 2.4 5.4 2.4s5.4-1.1 5.4-2.4v-4.2"/><path
      d="M21.2 8.4v5.2"/></svg><span>Tutoriels</span></button>
    <button data-page="params"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      ><circle cx="12" cy="12" r="3.1"/><circle cx="12" cy="12" r="6"/><path
      d="M18 12h2.2M16.2 7.8 17.8 6.2M12 6V3.8M7.8 7.8 6.2 6.2M6 12H3.8M7.8 16.2 6.2 17.8M12 18v2.2M16.2 16.2l1.6 1.6"/></svg><span>Paramètres</span></button>
    <button data-page="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
      ><path d="M12 7.1C10.3 5.8 8.2 5.1 6 5.1H3.6v12.4H6c2.2 0 4.3.7 6 2 1.7-1.3 3.8-2 6-2h2.4V5.1H18c-2.2 0-4.3.7-6 2Z"/><path
      d="M12 7.1v12.4"/><path d="M6 9.2h3.3M6 12.1h2.6M14.7 9.2H18M14.7 12.1h2.6"/></svg><span>Sources</span></button>
  </div>
  <div class="spacer"></div>
  <!-- Émoji et les DEUX côte à côte, choix de Yusuf (27/07) : le bouton dit
       ainsi qu'il bascule entre deux choses, sans avoir à deviner si le symbole
       montre l'état courant ou sa cible. Le sélecteur U+FE0F force la
       présentation EN COULEUR ; sans lui, ☀ sort en glyphe noir sur plusieurs
       plateformes, c'est-à-dire le rendu terne qu'on ne veut pas. -->
  <button class="iconbtn" id="theme-toggle" title="basculer clair/sombre"
    aria-label="basculer entre le mode clair et le mode sombre">
    <span class="i-soleil" aria-hidden="true">☀️</span>
    <span class="sep" aria-hidden="true"></span>
    <span class="i-lune" aria-hidden="true">🌙</span>
  </button>
</div>
